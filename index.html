<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Studio | Editor Profissional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: { 500: '#4f66f1', 600: '#3c47e8' },
            surface: { 900: '#171717', 950: '#0a0a0a' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #050505;
      background-image: radial-gradient(circle at 50% 50%, #111 1px, transparent 1px);
      background-size: 40px 40px;
      color: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    .glass-card {
      background: rgba(20, 20, 20, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .input-field {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      transition: all 0.2s;
    }

    .input-field:focus {
      border-color: #4f66f1;
      box-shadow: 0 0 0 2px rgba(79, 102, 241, 0.2);
      outline: none;
    }

    .btn-primary {
      background: #4f66f1;
      color: white;
      font-weight: 600;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background: #3c47e8;
      transform: translateY(-1px);
    }

    .preview-area {
      background-color: #000;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
  </style>
</head>
<body class="p-4 sm:p-8">

  <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-12 gap-8 glass-card p-8 animate-in">
    
    <!-- Esquerda: Configurações -->
    <div class="lg:col-span-5 space-y-8">
      <div class="flex items-center space-x-4 mb-2">
        <div class="w-10 h-10 bg-brand-500 rounded-xl flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>
        <div>
          <h1 class="text-xl font-extrabold text-white tracking-tight">Gradient Studio</h1>
          <p class="text-[10px] text-surface-500 uppercase tracking-[0.2em] font-bold">Pro Edition v5.0</p>
        </div>
      </div>

      <!-- Input de Texto -->
      <div class="space-y-4">
        <div class="space-y-2">
          <label class="text-[10px] font-bold text-surface-500 uppercase tracking-widest ml-1">Mensagem do Banner</label>
          <input type="text" id="textInput" value="GRADIENT" class="w-full input-field px-5 py-4 text-white font-medium" oninput="updateUI()">
        </div>

        <div class="flex gap-2">
          <button id="btnBold" onclick="toggleFormat('bold')" class="flex-1 py-3 input-field text-xs font-bold hover:text-brand-500 transition">BOLD</button>
          <button id="btnItalic" onclick="toggleFormat('italic')" class="flex-1 py-3 input-field text-xs font-bold hover:text-brand-500 transition">ITALIC</button>
          <button onclick="randomizePreset()" class="px-6 py-3 btn-primary text-xs">RANDOM</button>
        </div>
      </div>

      <!-- Cores -->
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <label class="text-[10px] font-bold text-surface-500 uppercase tracking-widest ml-1">Espectro Cromático</label>
          <select id="colorCount" class="bg-transparent border-none text-[10px] font-bold text-brand-500 focus:ring-0 cursor-pointer" onchange="handleColorCountChange()">
            <option value="2">2 CORES</option>
            <option value="3">3 CORES</option>
            <option value="4" selected>4 CORES</option>
          </select>
        </div>
        <div id="colorsContainer" class="grid grid-cols-2 gap-3"></div>
        <div class="h-1 bg-surface-900 rounded-full overflow-hidden"><div id="gradientPreview" class="h-full"></div></div>
      </div>

      <!-- Export -->
      <div class="space-y-4 pt-4 border-t border-white/5">
        <div class="flex gap-2">
          <select id="formatSelect" class="flex-1 input-field px-4 py-2 text-[10px] font-bold text-white uppercase" onchange="updateUI()">
            <option value="HTML_SPAN">HTML SPAN</option>
            <option value="HTML_FONT">HTML FONT</option>
            <option value="BBCODE">BBCODE</option>
            <option value="MINECRAFT_HEX">MINECRAFT</option>
          </select>
          <button onclick="copyCode()" class="btn-primary px-8 py-2 text-[10px] uppercase">Copiar</button>
        </div>
        <textarea id="outputText" readonly class="w-full h-24 input-field p-4 font-mono text-[10px] text-brand-500/80 resize-none"></textarea>
      </div>
    </div>

    <!-- Direita: Preview -->
    <div class="lg:col-span-7 flex flex-col h-full">
      <div class="preview-area flex-1 flex flex-col p-8 min-h-[400px]">
        <div class="flex items-center justify-between mb-8">
          <span class="text-[10px] font-bold text-surface-500 uppercase tracking-[0.2em]">Live Render Output</span>
          <div class="flex bg-black/40 p-1 rounded-lg border border-white/5">
            <button onclick="setTheme('dark')" id="themeDark" class="px-4 py-1.5 text-[9px] font-bold rounded-md bg-white/10 text-white">DARK</button>
            <button onclick="setTheme('light')" id="themeLight" class="px-4 py-1.5 text-[9px] font-bold rounded-md text-surface-500">LIGHT</button>
          </div>
        </div>

        <div id="previewBox" class="flex-1 flex items-center justify-center transition-all duration-500">
          <div id="livePreview" class="text-6xl md:text-8xl font-black tracking-tighter text-center break-words max-w-full drop-shadow-2xl"></div>
        </div>

        <div class="mt-8 flex items-center justify-between border-t border-white/5 pt-6 text-[10px] font-bold text-surface-500 uppercase tracking-widest">
          <div><span id="byteSize">0</span> BYTES // SYNCED</div>
          <button onclick="resetAll()" class="hover:text-white transition">Reset System</button>
        </div>
      </div>
    </div>

  </div>

  <div id="toast" class="fixed bottom-12 bg-white text-black text-[10px] font-black px-8 py-4 rounded-full shadow-2xl opacity-0 translate-y-4 transition-all duration-500 uppercase tracking-widest pointer-events-none">Copiado com sucesso</div>

  <script>
    const state = { text: 'GRADIENT', colors: ['4f66f1', '6366f1', 'ced9fd', 'a1b5fa'], format: 'HTML_SPAN', formatOptions: { bold: true, italic: false } };
    window.onload = () => { renderColors(); updateUI(); };

    function updateUI() {
      state.text = document.getElementById('textInput').value || 'STUDIO';
      state.format = document.getElementById('formatSelect').value;
      const preview = document.getElementById('livePreview');
      const output = document.getElementById('outputText');
      const grad = getGradient(state.colors, state.text.length);
      let s = state.formatOptions.bold ? 'font-weight:900;' : '';
      if (state.formatOptions.italic) s += 'font-style:italic;';

      preview.innerHTML = state.text.split('').map((ch, i) => `<span style="color:#${grad[i]};${s}">${ch===' '?'&nbsp;':escapeHtml(ch)}</span>`).join('');

      let code = '';
      if (state.format==='HTML_SPAN') state.text.split('').forEach((ch, i) => code += `<span style="color:#${grad[i]};${s}">${escapeHtml(ch)}</span>`);
      else if (state.format==='HTML_FONT') state.text.split('').forEach((ch, i) => code += `<font color="#${grad[i]}">${escapeHtml(ch)}</font>`);
      else if (state.format==='BBCODE') state.text.split('').forEach((ch, i) => code += `[color=#${grad[i]}]${ch}[/color]`);
      else if (state.format==='MINECRAFT_HEX') state.text.split('').forEach((ch, i) => code += `&#${grad[i]}${ch}`);

      output.value = code;
      document.getElementById('byteSize').textContent = new Blob([code]).size;
      const stops = state.colors.map((c, i) => `#${c} ${(i/(state.colors.length-1))*100}%`).join(', ');
      document.getElementById('gradientPreview').style.background = `linear-gradient(to right, ${stops})`;
    }

    function renderColors() {
      const c = document.getElementById('colorsContainer'); c.innerHTML = '';
      state.colors.forEach((hex, i) => {
        const d = document.createElement('div'); d.className = 'flex items-center space-x-3 p-3 bg-black/30 rounded-xl border border-white/5';
        d.innerHTML = `<input type="color" value="#${hex}" oninput="updateColor(${i},this.value)" class="w-6 h-6 bg-transparent border-none cursor-pointer"><input type="text" value="${hex.toUpperCase()}" maxlength="6" oninput="updateColorHex(${i},this.value)" class="bg-transparent border-none text-[10px] font-mono font-bold text-white w-full outline-none">`;
        c.appendChild(d);
      });
    }

    function updateColor(i, v) { state.colors[i] = v.replace('#',''); updateUI(); }
    function updateColorHex(i, v) { if(v.length===6) { state.colors[i]=v; updateUI(); } }
    function handleColorCountChange() { const n = parseInt(document.getElementById('colorCount').value); while(state.colors.length<n) state.colors.push('ffffff'); state.colors = state.colors.slice(0,n); renderColors(); updateUI(); }
    function toggleFormat(k) { state.formatOptions[k] = !state.formatOptions[k]; document.getElementById(`btn${k.charAt(0).toUpperCase()+k.slice(1)}`).classList.toggle('text-brand-500'); updateUI(); }
    function randomizePreset() {
      const vibrantPresets = [
        ['FF007F', 'FFFB00', '00F0FF', '9D00FF'],
        ['FF4B2B', 'FF416C', 'FF4B2B', 'FF416C'],
        ['00C9FF', '92FE9D', '00C9FF', '92FE9D'],
        ['8E2DE2', '4A00E0', '8E2DE2', '4A00E0'],
        ['F093FB', 'F5576C', 'F093FB', 'F5576C'],
        ['43E97B', '38F9D7', '43E97B', '38F9D7'],
        ['FA8BFF', '2BD2FF', '2BFF88', 'FA8BFF'],
        ['FF9A9E', 'FAD0C4', 'FF9A9E', 'FAD0C4']
      ];
      state.colors = vibrantPresets[Math.floor(Math.random() * vibrantPresets.length)];
      renderColors();
      updateUI();
      showToast('Paleta vibrante aplicada');
    }
    function copyCode() { const o = document.getElementById('outputText'); o.select(); document.execCommand('copy'); showToast(); }
    function showToast() { const t = document.getElementById('toast'); t.style.opacity = '1'; t.style.transform = 'translateY(0)'; setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(16px)'; }, 2000); }
    function setTheme(t) { const b = document.getElementById('previewBox'); b.parentElement.style.backgroundColor = t === 'light' ? '#eee' : '#000'; document.getElementById('themeDark').classList.toggle('bg-white/10', t==='dark'); document.getElementById('themeLight').classList.toggle('bg-white/10', t==='light'); }
    function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function hexToRgb(h) { const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function rgbToHex(r, g, b) { const h = (n) => Math.round(Math.max(0, Math.min(255, n))).toString(16).padStart(2, '0'); return h(r)+h(g)+h(b); }
    function getGradient(list, steps) {
      if (steps <= 1) return list.length ? [list[0]] : [];
      const rgbs = list.map(hexToRgb); const res = [];
      for (let i = 0; i < steps; i++) {
        const p = i / (steps - 1); const s = p * (rgbs.length - 1); const idx = Math.min(Math.floor(s), rgbs.length - 2); const f = s - idx;
        const c1 = rgbs[idx], c2 = rgbs[idx+1];
        res.push(rgbToHex(c1[0]+f*(c2[0]-c1[0]), c1[1]+f*(c2[1]-c1[1]), c1[2]+f*(c2[2]-c1[2])));
      }
      return res;
    }
    function resetAll() { location.reload(); }
  </script>
</body>
</html>
