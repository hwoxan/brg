<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarkZhN | Banner</title>
  
  <!-- Favicon -->
  <link rel="icon" href="https://web.archive.org/web/20221112235936im_/https://darkzhn.com/fav.ico" type="image/x-icon">

  <!-- Fontes & Ícones -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0b0e;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(30, 27, 75, 0.45) 0%, transparent 70%),
        radial-gradient(circle at 80% 20%, rgba(67, 56, 202, 0.15) 0%, transparent 40%);
    }

    /* Fallback para caso o JavaScript esteja desativado */
    noscript .no-js-warning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #08080a;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .no-js-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 36px 32px;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .no-js-box h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #f87171;
      margin-bottom: 14px;
    }

    .no-js-box p u {
      color: #94a3b8;
      font-size: 0.95rem;
      text-decoration: underline;
    }

    /* Banner Card Container */
    .banner-container {
      width: 100%;
      max-width: 680px;
      margin: 20px;
      background: rgba(18, 18, 24, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), 0 0 40px rgba(99, 102, 241, 0.08);
    }

    .banner-header {
      height: 180px;
      background: linear-gradient(135deg, #312e81 0%, #1e1b4b 50%, #0f172a 100%);
      position: relative;
    }

    .avatar-wrapper {
      position: absolute;
      bottom: -45px;
      left: 32px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #111116;
      border: 4px solid #121218;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .avatar-wrapper i {
      font-size: 42px;
      color: #a5b4fc;
    }

    .banner-content {
      padding: 56px 32px 32px;
    }

    .banner-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .banner-title .badge {
      font-size: 0.7rem;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #818cf8;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
    }

    .banner-subtitle {
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .banner-description {
      margin-top: 18px;
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .social-links {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      color: #fff;
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Mensagem original que aparece se o JS estiver desligado -->
  <noscript>
    <div class="no-js-warning">
      <div class="no-js-box">
        <h1>Tu navegador no es compatible con javascript</h1>
        <br>
        <p><u>Actualiza o habilita javascript en tu navegador</u></p>
      </div>
    </div>
  </noscript>

  <!-- Banner interativo / Perfil -->
  <main class="banner-container">
    <div class="banner-header">
      <div class="avatar-wrapper">
        <i class="fa-solid fa-terminal"></i>
      </div>
    </div>
    
    <div class="banner-content">
      <h2 class="banner-title">
        DarkZhN
        <span class="badge">Online</span>
      </h2>
      <p class="banner-subtitle">@darkzhn</p>

      <p class="banner-description">
        Developer & Gamer. Bem-vindo à página de banner/bio.
      </p>

      <div class="social-links">
        <a href="https://discord.com" class="social-btn" title="Discord" target="_blank" rel="noopener">
          <i class="fa-brands fa-discord"></i>
        </a>
        <a href="https://github.com" class="social-btn" title="GitHub" target="_blank" rel="noopener">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="https://twitter.com" class="social-btn" title="Twitter / X" target="_blank" rel="noopener">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
      </div>
    </div>
  </main>

  <script>
    console.log("JavaScript carregado com sucesso.");
  </script>
</body>
</html>
