<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANNER RGB GENERATOR Pro - Generador de Texto RGB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            },
            surface: {
              800: '#141824',
              850: '#0f131d',
              900: '#0b0e17',
              950: '#07090f',
            }
          }
        }
      }
    }
  </script>
  <style>
    .bg-grid-pattern {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }
    .preview-checker {
      background-color: #0b0f19;
      background-image: 
        linear-gradient(45deg, #131b2e 25%, transparent 25%), 
        linear-gradient(-45deg, #131b2e 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #131b2e 75%), 
        linear-gradient(-45deg, transparent 75%, #131b2e 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .preview-light { background-color: #f8fafc !important; color: #0f172a !important; }
    .preview-neon-grid {
      background-color: #08071a;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 80%),
        linear-gradient(to right, rgba(139, 92, 246, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(139, 92, 246, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
    }
    .preview-dark { background-color: #05070d; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
  </style>
</head>
<body class="bg-surface-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-5xl h-80 bg-gradient-to-b from-brand-600/10 via-purple-600/5 to-transparent blur-3xl pointer-events-none -z-10"></div>
  <header class="w-full border-b border-slate-800/80 bg-surface-900/60 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="font-extrabold text-base sm:text-lg tracking-tight text-white">BANNER RGB <span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-emerald-400">GENERATOR</span></span>
        <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold tracking-wider uppercase bg-sky-500/10 text-sky-400 border border-sky-500/20">PRO V2.0</span>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="invertColors()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 text-slate-300 transition">Invertir</button>
        <button onclick="resetAll()" class="flex items-center space-x-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 text-slate-400 transition">Reiniciar</button>
      </div>
    </div>
  </header>
  <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start pb-28">
    <div class="lg:col-span-5 space-y-5">
      <div class="bg-surface-900/80 backdrop-blur-md border border-slate-800/80 rounded-2xl p-5 shadow-xl">
        <label class="text-xs font-bold uppercase text-slate-400 mb-3 block">Texto</label>
        <input type="text" id="textInput" value="NET FREE" placeholder="Escribe tu texto..." class="w-full bg-surface-950/90 border border-slate-700/80 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition" oninput="generateRgbOutput()">
      </div>
      <div class="bg-surface-900/80 backdrop-blur-md border border-slate-800/80 rounded-2xl p-5 shadow-xl space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold uppercase text-slate-400">Colores</span>
          <select id="colorCount" class="bg-surface-950 border border-slate-700/80 text-sky-400 text-xs rounded-lg px-2 py-1" onchange="handleColorCountChange()">
            <option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option>
          </select>
        </div>
        <div id="colorsContainer" class="space-y-2.5 max-h-[300px] overflow-y-auto pr-1"></div>
      </div>
    </div>
    <div class="lg:col-span-7 space-y-5">
      <div class="bg-surface-900/80 backdrop-blur-md border border-slate-800/80 rounded-2xl p-6 shadow-xl">
        <div id="previewContainer" class="preview-dark w-full min-h-[200px] rounded-xl border border-slate-800 flex items-center justify-center p-6 text-center">
          <div id="livePreview" class="text-3xl sm:text-5xl font-black tracking-wider break-words select-text"></div>
        </div>
      </div>
      <div class="bg-surface-900/80 backdrop-blur-md border border-slate-800/80 rounded-2xl p-6 shadow-xl">
        <textarea id="generatedOutput" readonly rows="7" class="w-full p-4 bg-surface-950 border border-slate-800 rounded-xl font-mono text-xs text-sky-300 outline-none"></textarea>
        <button onclick="copyGeneratedCode()" class="mt-3 w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2 rounded-xl transition">Copiar Código</button>
      </div>
    </div>
  </main>
  <script>
    const state = { text: 'NET FREE', colors: ['00A1FB', '01FD75'], format: 'HTML_SPAN' };
    function renderColorInputs() {
      const container = document.getElementById('colorsContainer');
      container.innerHTML = '';
      state.colors.forEach((hex, index) => {
        const item = document.createElement('div');
        item.className = "flex items-center space-x-2 bg-surface-950/70 p-2 rounded-xl border border-slate-800";
        item.innerHTML = `<input type="color" value="#${hex}" class="w-8 h-8 cursor-pointer" oninput="updateColor(${index}, this.value)"><input type="text" value="${hex}" class="w-full bg-transparent text-xs font-mono text-white outline-none" oninput="updateColor(${index}, this.value)">`;
        container.appendChild(item);
      });
    }
    function updateColor(index, val) { state.colors[index] = val.replace('#', '').toUpperCase(); generateRgbOutput(); }
    function handleColorCountChange() {
      const count = parseInt(document.getElementById('colorCount').value, 10);
      state.colors = state.colors.slice(0, count);
      while(state.colors.length < count) state.colors.push('FFFFFF');
      renderColorInputs(); generateRgbOutput();
    }
    function hexToRgb(h) { h = h.replace('#',''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function generateRgbOutput() {
      const text = document.getElementById('textInput').value;
      const rgb = state.colors.map(hexToRgb);
      let html = '', code = '';
      for (let i = 0; i < text.length; i++) {
        const prog = i / (text.length - 1 || 1) * (rgb.length - 1);
        const idx = Math.min(Math.floor(prog), rgb.length - 2);
        const f = prog - idx;
        const c = [rgb[idx][0] + f*(rgb[idx+1][0]-rgb[idx][0]), rgb[idx][1] + f*(rgb[idx+1][1]-rgb[idx][1]), rgb[idx][2] + f*(rgb[idx+1][2]-rgb[idx][2])].map(Math.round);
        const hex = c.map(x => x.toString(16).padStart(2,'0')).join('').toUpperCase();
        html += `<span style="color:#${hex}">${text[i]}</span>`;
        code += `<font color="#${hex}">${text[i]}</font>`;
      }
      document.getElementById('livePreview').innerHTML = html;
      document.getElementById('generatedOutput').value = code;
    }
    function copyGeneratedCode() { navigator.clipboard.writeText(document.getElementById('generatedOutput').value); alert('Copiado!'); }
    window.onload = () => { renderColorInputs(); generateRgbOutput(); };
  </script>
</body>
</html>
